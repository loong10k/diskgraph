[package]
readme = "README.md"
name = "diskgraph-mcp"
description = "MCP protocol adapter for DiskGraph (stdio, Streamable HTTP, legacy SSE)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true


[[bin]]
name = "diskgraph-mcp"
path = "src/main.rs"

[dependencies]
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
diskgraph-core.workspace = true
diskgraph-engine.workspace = true
diskgraph-scan-worker = { path = "../diskgraph-scan-worker" }
diskgraph-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_SystemServices"] }

[dev-dependencies]
syn = { version = "2.0.119", features = ["full", "visit"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
diskgraph-testkit.workspace = true
tempfile = "3"
