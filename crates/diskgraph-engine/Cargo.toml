[package]
readme = "README.md"
name = "diskgraph-engine"
description = "Job orchestration, staging, and authorized scope services for DiskGraph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true


[features]
default = ["macos_native_scan_candidate"]
# 已完成 macOS ARM/Intel 固定安装原生验收；保留旧 feature 名称兼容显式构建。
# 平台分支仍由 target_os 控制，其他系统不获得 macOS 执行能力。
macos_native_scan_candidate = []

[dependencies]
sha2.workspace = true
sha1.workspace = true
hex.workspace = true
serde_json.workspace = true
libc = "0.2"
diskgraph-core.workspace = true
diskgraph-store.workspace = true
diskgraph-disktree.workspace = true
diskgraph-disktree-core.workspace = true
diskgraph-scan-worker = { path = "../diskgraph-scan-worker" }
serde.workspace = true
thiserror = "2"
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[target.'cfg(target_os = "macos")'.dependencies]
ed25519-dalek = "=2.2.0"

[dev-dependencies]
diskgraph-testkit.workspace = true
tempfile = "3"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
syn = { version = "2.0.119", features = ["full", "visit"] }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dev-dependencies]
cc = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_CloudFilters", "Win32_System_CorrelationVector"] }

# 真实协议/进程处置夹具；不作为可信安装或产品扫描 helper。
[[example]]
name = "scan_worker_driver_fixture"
path = "tests/fixtures/scan_worker_driver_fixture.rs"
