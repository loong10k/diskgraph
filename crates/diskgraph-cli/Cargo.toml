[package]
readme = "README.md"
name = "diskgraph-cli"
description = "DiskGraph command line entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true


[[bin]]
name = "diskgraph"
path = "src/main.rs"

[dependencies]
diskgraph-disktree-core.workspace = true
clap.workspace = true
diskgraph-core.workspace = true
diskgraph-engine.workspace = true
diskgraph-scan-worker = { path = "../diskgraph-scan-worker" }
diskgraph-mcp.workspace = true
diskgraph-store.workspace = true
serde_json.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = ["all-widgets", "crossterm_0_28", "layout-cache"] }
crossterm = "0.28"
[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
syn = { version = "2.0.119", features = ["full", "visit"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
libc = "0.2"
