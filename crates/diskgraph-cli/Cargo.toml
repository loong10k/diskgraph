[package]
name = "diskgraph-cli"
description = "DiskGraph command line entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not published to crates.io: this crate depends on disktree-core, which is
# pinned to a git revision (upstream disktree is not on crates.io, and the
# pin is what makes scans reproducible). crates.io requires registry
# dependencies, so binary users get diskgraph through GitHub Releases, the
# Homebrew tap, npm, winget, or scoop instead. See RELEASING.md.
publish = false

[[bin]]
name = "diskgraph"
path = "src/main.rs"

[dependencies]
disktree-core.workspace = true
clap.workspace = true
diskgraph-core.workspace = true
diskgraph-engine.workspace = true
diskgraph-mcp.workspace = true
diskgraph-store.workspace = true
serde_json.workspace = true
[dev-dependencies]
tempfile = "3"

