[package]
name = "diskgraph-ffi"
description = "Swift and Kotlin read-only bindings for DiskGraph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
diskgraph-core.workspace = true
diskgraph-store.workspace = true
diskgraph-disktree.workspace = true
diskgraph-engine.workspace = true
disktree-core.workspace = true
serde_json.workspace = true
uniffi = { version = "0.32.2", features = ["cli"] }

[dev-dependencies]
tempfile = "3"
