[package]
readme = "README.md"
name = "diskgraph-ffi"
description = "Swift and Kotlin read-only bindings for DiskGraph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true


[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
diskgraph-core.workspace = true
diskgraph-store.workspace = true
diskgraph-disktree.workspace = true
diskgraph-engine.workspace = true
diskgraph-disktree-core.workspace = true
serde_json.workspace = true
thiserror = "2"
sha2.workspace = true
hex.workspace = true
uniffi = { version = "0.32.2", features = ["cli"] }

[dev-dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
tempfile = "3"
syn = { version = "2.0.119", features = ["full", "visit"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
