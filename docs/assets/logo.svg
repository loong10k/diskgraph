    <rect x="8"  y="16" width="46" height="48" fill="#3f6ea8"/>
    <rect x="58" y="16" width="26" height="30" fill="#5a9e8f"/>
    <rect x="58" y="48" width="26" height="16" fill="#c9a227"/>
    <rect x="88" y="16" width="18" height="48" fill="#7a6ea8"/>
    <rect x="110" y="16" width="14" height="22" fill="#c46a7a"/>
    <rect x="110" y="40" width="14" height="24" fill="#4a5462"/>
    <rect x="128" y="16" width="10" height="48" fill="#a86ea0"/>
  </g>
  <text x="150" y="46" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif"
