[workspace]
resolver = "3"
members = [
    "crates/diskgraph-core",
    "crates/diskgraph-store",
    "crates/diskgraph-disktree",
    "crates/diskgraph-ffi",
    "crates/diskgraph-testkit",
    "crates/diskgraph-engine",
    "crates/diskgraph-cli",
    "crates/diskgraph-mcp",
    "crates/diskgraph-ops",
]
# The vendored upstream scanner (MIT, tobi/disktree @ 158f9cc) builds as its
# own workspace root so the repository's format and lint gates never rewrite
# the bytes its pin is verified against; see its VENDORED.md.
exclude = ["crates/diskgraph-disktree-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/loong10k/diskgraph"
homepage = "https://github.com/loong10k/diskgraph"
documentation = "https://docs.rs/diskgraph-core"
keywords = ["disk", "filesystem", "graph", "cleanup", "mcp", "ai-agent"]
categories = ["filesystem", "command-line-utilities", "database-implementations"]


[workspace.dependencies]
diskgraph-disktree-core = { path = "crates/diskgraph-disktree-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rayon = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
diskgraph-core = { path = "crates/diskgraph-core", version = "0.1.0" }
diskgraph-store = { path = "crates/diskgraph-store", version = "0.1.0" }
diskgraph-disktree = { path = "crates/diskgraph-disktree", version = "0.1.0" }
diskgraph-testkit = { path = "crates/diskgraph-testkit", version = "0.1.0" }
diskgraph-engine = { path = "crates/diskgraph-engine", version = "0.1.0" }
diskgraph-cli = { path = "crates/diskgraph-cli", version = "0.1.0" }
diskgraph-mcp = { path = "crates/diskgraph-mcp", version = "0.1.0" }
diskgraph-ops = { path = "crates/diskgraph-ops", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
# The vendored upstream scanner (MIT, tobi/disktree @ 158f9cc). It lives
# outside this workspace so our format/lint gates never rewrite the pinned
# bytes; crates/diskgraph-disktree-core/VENDORED.md records the provenance.
