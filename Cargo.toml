[workspace]
resolver = "3"
members = ["crates/diskgraph-core", "crates/diskgraph-disktree"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/loong10k/diskgraph"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
