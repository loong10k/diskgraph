name: Windows scan cleanup qualification
on:
  workflow_dispatch:
    inputs:
      compare_baseline:
        description: Run the fixed pre-birth source comparison on the same runner
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Obtain exact historical workspace for isolated qualification
        # 只取得冻结基线的完整 commit；不切换产品 checkout 或更新 lockfile。
        env:
          BASELINE_COMMIT: 8878912fb579f741b7776a2b533efc3237541c23
        run: git fetch --no-tags --depth=1 origin $env:BASELINE_COMMIT
      - name: Obtain exact original directory enumeration implementation
        run: git fetch --no-tags --depth=1 origin 888fbc20031baed5cca113eacf18e7ae81590ecd
      - name: Verify archive mounting safeguards
        run: python -m unittest discover -s scripts/tests -p test_macos_installed_qualifier.py -v
      - name: Verify exact native inventory and platform gate
        run: python -m unittest discover -s scripts/tests -p test_windows_scan_cleanup_qualifier.py -v
      - name: Actual old-source prepared birth lost-owner RED
        run: python scripts/qualify_windows_prepared_birth_baseline.py --output-dir "${{ runner.temp }}/windows-prepared-birth-baseline"
      - name: Actual old directory enumeration target RED
        run: python scripts/qualify_windows_directory_enumeration.py --output-dir "${{ runner.temp }}/windows-directory-baseline"
      - name: Actual Windows owner cleanup qualification
        run: python scripts/qualify_windows_scan_cleanup.py --output-dir "${{ runner.temp }}/windows-cleanup"
      - name: Original source normal-exit comparison
        if: ${{ always() && inputs.compare_baseline }}
        run: python scripts/qualify_windows_scan_cleanup.py --baseline --output-dir "${{ runner.temp }}/windows-cleanup-baseline"
      - name: Preserve exact source and native failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-cleanup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/windows-cleanup
            ${{ runner.temp }}/windows-prepared-birth-baseline
            ${{ runner.temp }}/windows-directory-baseline
            crates/diskgraph-engine/integration_candidates/windows_prepared_birth_baseline
            ${{ runner.temp }}/windows-cleanup-baseline
            crates/diskgraph-engine/integration_candidates/windows_cleanup
            crates/diskgraph-engine/integration_candidates/windows_cleanup_baseline
