name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

# 同一分支只执行最新常规门禁；独立原生资格/性能工作流使用自己的生命周期。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.97.0"]
        include:
          - os: macos-15-intel
            rust: stable
          - os: ubuntu-24.04-arm
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
      # Pinned by tag: this action's current master commit exits 1 on
      # today's runners, while the release tag resolves and works.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build exact native Windows CLI exit fixtures
        if: runner.os == 'Windows'
        run: ./scripts/configure_windows_exit_fixtures.ps1
      - name: Preserve Windows CLI exit fixture receipt
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-cli-exit-fixtures-${{ matrix.rust }}-${{ github.run_id }}
          path: ${{ runner.temp }}/diskgraph-windows-exit-fixtures/
          if-no-files-found: error
      - name: Build exact native Linux group-view fixture
        if: runner.os == 'Linux'
        run: |
          probe="${{ runner.temp }}/diskgraph-linux-group-view-probe"
          cc -std=c11 -O2 -pthread -Wall -Wextra -Werror \
            crates/diskgraph-engine/tests/fixtures/linux_group_view_probe.c -o "$probe"
          sha256sum crates/diskgraph-engine/tests/fixtures/linux_group_view_probe.c "$probe" \
            > "${{ runner.temp }}/diskgraph-linux-group-view-digests.txt"
          echo "DG_LINUX_GROUP_PROBE_BINARY=$probe" >> "$GITHUB_ENV"
      - name: Build exact native Linux atomic-birth fixtures
        if: runner.os == 'Linux'
        run: |
          probe="${{ runner.temp }}/diskgraph-linux-atomic-birth-probe"
          replacement="${{ runner.temp }}/diskgraph-linux-atomic-birth-replacement"
          source="crates/diskgraph-engine/tests/fixtures/linux_atomic_birth_probe.c"
          cc -std=c11 -O2 -pthread -Wall -Wextra -Werror "$source" -o "$probe"
          cc -std=c11 -O2 -pthread -Wall -Wextra -Werror -DDG_ATOMIC_IMAGE_ID=2 "$source" -o "$replacement"
          sha256sum "$source" "$probe" "$replacement" > "${{ runner.temp }}/diskgraph-linux-atomic-birth-digests.txt"
          echo "DG_LINUX_ATOMIC_BIRTH_PROBE=$probe" >> "$GITHUB_ENV"
          echo "DG_LINUX_ATOMIC_BIRTH_REPLACEMENT=$replacement" >> "$GITHUB_ENV"
      - name: Build exact native Linux atomic-launcher fixtures
        if: runner.os == 'Linux'
        run: |
          probe="${{ runner.temp }}/diskgraph-linux-atomic-launch-fixture"
          replacement="${{ runner.temp }}/diskgraph-linux-atomic-launch-replacement"
          source="crates/diskgraph-engine/tests/fixtures/linux_atomic_launcher_fixture.c"
          cc -std=c11 -O2 -pthread -Wall -Wextra -Werror -DIMAGE_ID=1 "$source" -o "$probe"
          cc -std=c11 -O2 -pthread -Wall -Wextra -Werror -DIMAGE_ID=2 "$source" -o "$replacement"
          sha256sum "$source" "$probe" "$replacement" > "${{ runner.temp }}/diskgraph-linux-atomic-launch-digests.txt"
          echo "DG_LINUX_ATOMIC_LAUNCH_FIXTURE=$probe" >> "$GITHUB_ENV"
          echo "DG_LINUX_ATOMIC_LAUNCH_REPLACEMENT=$replacement" >> "$GITHUB_ENV"
      # 实际原生单元边界先运行，保留全局 -D warnings；随后完整产品 Build 仍为必需门禁。
      # --lib 使用正常 cfg(test) 构建，不复制源码、关闭 lint 或替代产品构建验收。
      - name: Native Windows image material unit boundary
        if: runner.os == 'Windows'
        run: cargo test -p diskgraph-engine --lib --locked windows_scan_image_lease_tests -- --nocapture
      - name: Native Windows current Rust surviving writable image view
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          cargo test -p diskgraph-engine --lib --locked windows_scan_image_mapping_tests -- --nocapture 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-current-image-view.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content "$env:RUNNER_TEMP/windows-current-image-view.log" -Raw
          if ($log -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;' -or
              $log -notmatch 'DG_CURRENT_RUST_WRITABLE_VIEW_HANDLES_CLOSED=1' -or
              $log -notmatch 'DG_CURRENT_RUST_VIEW_REJECTED_RELEASED_IMAGE_QUALIFIED=1') {
            throw 'Actual current Rust retained-view rejection and released positive must execute'
          }
      - name: Preserve current Rust Windows image-view admission result
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-current-image-view-${{ matrix.rust }}-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-current-image-view.log
          if-no-files-found: error
      - name: Native Windows borrowed process image-name binding
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          cargo test -p diskgraph-engine --lib --locked native_child::windows::windows_child::windows_process_image_name_tests -- --nocapture 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-process-image-name.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content "$env:RUNNER_TEMP/windows-process-image-name.log" -Raw
          if ($log -notmatch 'test result: ok\. 2 passed; 0 failed; 0 ignored;' -or
              $log -notmatch 'DG_WINDOWS_PROCESS_ORIGINAL_NAME_BOUND=1' -or
              $log -notmatch 'DG_WINDOWS_PROCESS_FOREIGN_NAME_REJECTED=1') {
            throw 'Both actual suspended process-name cases must execute'
          }
      - name: Preserve Windows process image-name binding result
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-process-image-name-${{ matrix.rust }}-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-process-image-name.log
          if-no-files-found: error
      - name: Native Windows private directory cleanup unit boundary
        if: runner.os == 'Windows'
        run: cargo test -p diskgraph-engine --lib --locked live_evidence::windows_git_cleanup_tests -- --nocapture
      - name: Native Windows pre-resume admission boundary
        if: runner.os == 'Windows'
        run: cargo test -p diskgraph-engine --lib --locked revoked_admission_after_birth_prevents_resume_and_retains_original_owner -- --nocapture
      - name: Native Windows pending IO ownership transfer
        if: runner.os == 'Windows'
        run: cargo test -p diskgraph-engine --lib --locked native_child::windows::windows_io_transfer_tests -- --nocapture
      - name: Native Windows bounded pending cleanup
        if: runner.os == 'Windows'
        run: cargo test -p diskgraph-engine --lib --locked native_child::windows::windows_poll_cleanup_tests -- --nocapture
      - name: Native Windows suspended image load policy
        if: runner.os == 'Windows'
        run: cargo test -p diskgraph-engine --lib --locked suspended_birth_enforces_image_load_policy_before_resume -- --nocapture
      - name: Native Windows suspended scan signature policy
        if: runner.os == 'Windows'
        run: |
          cargo test -p diskgraph-engine --lib --locked native_child::windows::windows_child::windows_image_policy_tests -- --nocapture 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-signature-policy.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content "$env:RUNNER_TEMP/windows-signature-policy.log" -Raw
          if ($log -notmatch 'test result: ok\. 3 passed; 0 failed; 0 ignored;' -or
              $log -notmatch 'suspended_scan_control_requires_microsoft_signature_before_resume' -or
              $log -notmatch 'suspended_null_probe_retains_existing_signature_policy') {
            throw 'Exact original three native policy cases must execute'
          }
      - name: Preserve actual Windows scan signature policy result
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-signature-policy-${{ matrix.rust }}-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-signature-policy.log
          if-no-files-found: error
      - name: Native Windows resumed DLL loading positive and negative controls
        if: runner.os == 'Windows'
        run: |
          cargo test -p diskgraph-engine --lib --locked native_child::windows::windows_dll_policy_tests -- --nocapture 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-dll-loader.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content "$env:RUNNER_TEMP/windows-dll-loader.log" -Raw
          if ($log -notmatch 'test result: ok\. 2 passed; 0 failed; 0 ignored;' -or
              $log -notmatch 'DG_SCAN_UNSIGNED_REJECTED_SYSTEM32_LOADED=' -or
              $log -notmatch 'DG_NULL_UNSIGNED_DLL_POSITIVE=') {
            throw 'Both actual resumed DLL loader controls must execute'
          }
      - name: Preserve actual Windows resumed DLL loader result
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-dll-loader-${{ matrix.rust }}-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-dll-loader.log
          if-no-files-found: error
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: runner.os == 'macOS'
        with:
          python-version: '3.13'
      - name: Prepare actual fixed macOS installation for workspace
        if: runner.os == 'macOS'
        id: macos_host_preparation
        run: |
          python -m unittest discover -s scripts/tests -p test_macos_host_preparation.py -v
          python scripts/qualify_macos_installed_worker.py --current-checkout --prepare-host-only --output-dir "$RUNNER_TEMP/macos-host-preparation"
      - name: Preserve macOS deployment preparation evidence
        if: always() && steps.macos_host_preparation.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-preparation-workspace-${{ matrix.os }}-${{ matrix.rust }}-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-host-preparation
          if-no-files-found: error
          retention-days: 7
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Build actual Windows scan worker for protocol qualification
        if: runner.os == 'Windows'
        run: |
          cargo build -p diskgraph-scan-worker --locked --message-format=json > "$env:RUNNER_TEMP/windows-worker-build.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/configure_windows_acceptance_worker.ps1 -Artifacts "$env:RUNNER_TEMP/windows-worker-build.jsonl" -OutputDir "$env:RUNNER_TEMP"
      - name: Native Windows actual worker protocol and original cancellation
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          cargo test -p diskgraph-engine --lib --locked native_child::windows::windows_worker_protocol_tests -- --nocapture 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-worker-protocol.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content "$env:RUNNER_TEMP/windows-worker-protocol.log" -Raw
          if ($log -notmatch 'test result: ok\. 2 passed; 0 failed; 0 ignored;' -or
              $log -notmatch 'DG_CURRENT_WINDOWS_WORKER_RAW_SCAN_NORMAL_EXIT=1' -or
              $log -notmatch 'DG_CURRENT_WINDOWS_WORKER_ORIGINAL_CANCEL_REAPED=1') {
            throw 'Both current worker native protocol cases must execute'
          }
      - name: Preserve actual Windows worker protocol evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-worker-protocol-${{ matrix.rust }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/windows-worker-build.jsonl
            ${{ runner.temp }}/product-worker-receipt.json
            ${{ runner.temp }}/windows-worker-protocol.log
          if-no-files-found: error
      - name: Native Windows bound product Runtime and retained image recovery
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          cargo test -p diskgraph-engine --lib --locked windows_scan_runtime_tests -- --nocapture 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-bound-runtime.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content "$env:RUNNER_TEMP/windows-bound-runtime.log" -Raw
          if ($log -notmatch 'test result: ok\. 5 passed; 0 failed; 0 ignored;' -or
              $log -notmatch 'DG_WINDOWS_BOUND_RUNTIME_COMPLETE_SCAN=1' -or
              $log -notmatch 'DG_WINDOWS_FAILED_OWNER_RETAINS_IMAGE_AFTER_HOST_DROP=1' -or
              $log -notmatch 'DG_WINDOWS_BOUND_RUNTIME_ORIGINAL_REVOCATION=1' -or
              $log -notmatch 'DG_WINDOWS_RESUMED_OWNER_RETAINS_IMAGE_AFTER_HOST_DROP=1' -or
              $log -notmatch 'DG_WINDOWS_BOUND_RUNTIME_ORIGINAL_PANIC_REAPED=1') {
            throw 'All five actual bound Runtime and ownership cases must execute'
          }
      - name: Preserve Windows bound product Runtime evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-bound-runtime-${{ matrix.rust }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/windows-bound-runtime.log
            ${{ runner.temp }}/product-worker-receipt.json
          if-no-files-found: error
      - name: Native Linux thread-group and procfs qualification
        if: runner.os == 'Linux'
        run: |
          cargo test -p diskgraph-engine --test linux_group_view_probe --locked -- \
            --nocapture --test-threads=1 \
            > "${{ runner.temp }}/diskgraph-linux-group-view.log" 2>&1
      - name: Native Linux atomic-birth qualification
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          cargo test -p diskgraph-engine --lib --locked native_child::linux_atomic_birth_tests -- \
            --nocapture --test-threads=1 > "${{ runner.temp }}/diskgraph-linux-atomic-birth.log" 2>&1
      - name: Preserve native Linux atomic-birth qualification
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.3.3
        with:
          name: linux-atomic-birth-${{ matrix.os }}-${{ matrix.rust }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/diskgraph-linux-atomic-birth-digests.txt
            ${{ runner.temp }}/diskgraph-linux-atomic-launch-digests.txt
            ${{ runner.temp }}/diskgraph-linux-atomic-birth.log
          retention-days: 7
          if-no-files-found: error
      - name: Preserve native Linux group-view qualification
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.3.3
        with:
          name: linux-group-view-${{ matrix.os }}-${{ matrix.rust }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/diskgraph-linux-group-view-digests.txt
            ${{ runner.temp }}/diskgraph-linux-group-view.log
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build explicit protocol-driver test fixture
        id: driver_fixture
        shell: bash
        run: |
          cargo build -p diskgraph-engine --example scan_worker_driver_fixture --locked --message-format=json > "${{ runner.temp }}/protocol-driver-build.jsonl"
          python - <<'PYTHON'
          import hashlib, json, os, subprocess
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"])
          rows = [json.loads(line) for line in (output / "protocol-driver-build.jsonl").read_text(encoding="utf-8").splitlines()]
          artifacts = [row for row in rows if row.get("reason") == "compiler-artifact"
                       and row.get("target", {}).get("name") == "scan_worker_driver_fixture"
                       and row.get("target", {}).get("kind") == ["example"] and row.get("executable")]
          if len(artifacts) != 1:
              raise SystemExit("one actual Cargo protocol-driver artifact is required")
          image = Path(artifacts[0]["executable"])
          if not image.is_absolute() or image.is_symlink() or not image.is_file() or any(c in str(image) for c in "\r\n\0"):
              raise SystemExit("invalid protocol-driver artifact path")
          with image.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          receipt = {"checkout_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                     "fixture_sha256": digest, "fixture_bytes": image.stat().st_size,
                     "fixture_source_sha256": hashlib.sha256(Path("crates/diskgraph-engine/tests/fixtures/scan_worker_driver_fixture.rs").read_bytes()).hexdigest(),
                     "product_scan_image": False, "production_acceptance": False}
          (output / "protocol-driver-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write("DISKGRAPH_SCAN_DRIVER_FIXTURE=" + str(image) + "\n")
          PYTHON
      - name: Preserve actual protocol-driver identity
        if: always() && steps.driver_fixture.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protocol-driver-${{ matrix.os }}-${{ matrix.rust }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/protocol-driver-build.jsonl
            ${{ runner.temp }}/protocol-driver-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify current sealed-image source contracts
        if: runner.os == 'Linux'
        run: python -m unittest discover -s scripts/tests -p test_linux_scan_image_current_sources.py -v
      - name: Native Linux sealed-image component qualification
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: python scripts/qualify-linux-scan-image.py --output-dir "${{ runner.temp }}/diskgraph-sealed-image"
      - name: Preserve Linux sealed-image component evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.3.3
        with:
          name: linux-sealed-image-${{ matrix.os }}-${{ matrix.rust }}-${{ github.run_id }}
          path: ${{ runner.temp }}/diskgraph-sealed-image
          retention-days: 7
          if-no-files-found: error
      - name: Build scoped owner acceptance library
        timeout-minutes: 10
        run: cargo build -p diskgraph-ffi --lib --locked --message-format=json > "${{ runner.temp }}/diskgraph-owner-build.json"
      - name: Native scoped owner type constraints
        timeout-minutes: 10
        run: python scripts/accept-ffi-scoped-owner.py --cargo-artifacts "${{ runner.temp }}/diskgraph-owner-build.json" --output "${{ runner.temp }}/diskgraph-owner-probes"
      - name: Preserve scoped owner compile diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.3.3
        with:
          name: scoped-owner-${{ matrix.os }}-${{ matrix.rust }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/diskgraph-owner-build.json
            ${{ runner.temp }}/diskgraph-owner-probes
          retention-days: 7
          if-no-files-found: error
      - name: Configure actual Linux worker for product acceptance
        if: runner.os == 'Linux'
        id: linux_product_worker
        run: |
          cargo build -p diskgraph-scan-worker --bin diskgraph-scan-worker --locked --message-format=json > "${{ runner.temp }}/product-worker-build.jsonl"
          python -m unittest discover -s scripts/tests -p test_linux_acceptance_worker.py -v
          python scripts/configure_linux_acceptance_worker.py --artifacts "${{ runner.temp }}/product-worker-build.jsonl" --output-dir "${{ runner.temp }}"
          python - <<'PYTHON'
          import os
          from pathlib import Path
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write("DISKGRAPH_ENGINE_SCAN_WORKER=" + str(Path(os.environ["RUNNER_TEMP"]) / "product-scan-worker") + "\n")
          PYTHON
      - name: Preserve actual Linux product worker identity
        if: always() && steps.linux_product_worker.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-worker-${{ matrix.os }}-${{ matrix.rust }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/product-worker-build.jsonl
            ${{ runner.temp }}/product-worker-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Read-only CLI, stdio and authenticated HTTP acceptance
        run: |
          python scripts/accept-readonly-stdio.py
          python scripts/accept-readonly-http.py
      # Preserve exact deadline assertions in both isolated and concurrent runs.
      # This separates scheduler/IO observations without treating either as a substitute.
      - name: Native expiry after actual scan observation in isolation
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          cargo test -p diskgraph-engine --lib --locked job_authorization_tests::remote_expiry_after_native_observation_prevents_staging_and_publication -- --exact --nocapture --test-threads=1 > "$RUNNER_TEMP/native-scan-expiry.log" 2>&1
          python - <<'PYTHON'
          import os
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP']) / 'native-scan-expiry.log').read_text()
          if 'test result: ok. 1 passed; 0 failed; 0 ignored;' not in log:
              raise RuntimeError('original exact native observation expiry case must execute')
          PYTHON
      - name: Preserve native observation expiry result
        if: always() && (runner.os == 'Linux' || runner.os == 'macOS')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-scan-expiry-${{ matrix.os }}-${{ matrix.rust }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-scan-expiry.log
          if-no-files-found: error
      - name: Native queue deadline isolation
        run: cargo test -p diskgraph-store --lib --locked process_job_enqueue_deadline_tests -- --test-threads=1
      - name: Native Windows original directory retry red and green
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: python scripts/qualify_windows_directory_retry.py
      - name: Preserve native Windows directory retry evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-directory-retry-${{ matrix.rust }}-${{ github.run_id }}
          path: ${{ runner.temp }}/diskgraph-windows-directory-retry/
          if-no-files-found: error
      - name: Native control write deadline isolation
        run: cargo test -p diskgraph-store --lib --locked control_write_deadline_tests -- --test-threads=1
      - name: Native control writer stage diagnostics
        run: cargo test -p diskgraph-store --lib --locked control_write_deadline_probe_tests -- --nocapture --test-threads=1
      - name: Native Linux queued startup error after socket reset
        if: runner.os == 'Linux'
        run: cargo test -p diskgraph-engine --lib --locked native_child::linux_atomic_startup_reset_tests -- --nocapture
      - name: Native Linux authorization changes after actual capture
        if: runner.os == 'Linux'
        run: cargo test -p diskgraph-engine --lib --locked observation_stage_refuses_grant_scope_and_fence_changes_after_native_capture -- --nocapture
      - name: Native Linux normal wait authorization contract
        if: runner.os == 'Linux'
        run: |
          cargo test -p diskgraph-engine --lib --locked native_child::linux_atomic_normal_contract_tests -- \
            --nocapture > "${{ runner.temp }}/diskgraph-linux-normal-wait.log" 2>&1
      - name: Preserve native Linux normal wait evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-normal-wait-${{ matrix.os }}-${{ matrix.rust }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/diskgraph-linux-normal-wait.log
            ${{ runner.temp }}/diskgraph-linux-atomic-launch-digests.txt
          retention-days: 7
          if-no-files-found: error
      - name: Native Linux public FFI synchronous scan
        if: runner.os == 'Linux'
        run: cargo test -p diskgraph-ffi --lib --locked read_only_bindings_scan_and_query_native_directory -- --nocapture
      - name: Native Linux scoped FFI service scan
        if: runner.os == 'Linux'
        run: cargo test -p diskgraph-ffi --lib --locked scoped_service_scans_with_physical_host_and_closes_after_scope -- --nocapture
      - name: Native Linux public FFI asynchronous scan
        if: runner.os == 'Linux'
        run: cargo test -p diskgraph-ffi --lib --locked a_spawned_scan_returns_a_handle_at_once_and_join_later -- --nocapture
      - name: Native Linux legacy FFI service scan and revocation
        if: runner.os == 'Linux'
        run: |
          cargo test -p diskgraph-ffi --lib --locked two_native_handles_for_a_coalesced_job_return_the_same_revision -- --nocapture
          cargo test -p diskgraph-ffi --lib --locked legacy_service_scan_does_not_restore_revoked_admin_grant -- --nocapture
      - name: Test
        timeout-minutes: 30
        run: cargo test --workspace --all-targets --locked --no-fail-fast
      - name: Native Linux identity and process scan fixtures
        if: always() && runner.os == 'Linux' && steps.linux_product_worker.outcome == 'success'
        run: cargo test -p diskgraph-engine --locked --test linux_process_epoch --test linux_process_execution --test linux_process_observation -- --nocapture --test-threads=1
      - name: Native Git source-metadata sentinel repetition
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import subprocess
          subprocess.run(["git", "--version"], check=True)
          names = [
              "live_evidence::git_isolation_tests::source_metadata_is_unchanged_on_success_budget_failure_and_precancel",
              "live_evidence::git_isolation_semantics_tests::sha256_format_and_tracking_counts_are_preserved_without_skipping_capability",
          ]
          for attempt in range(20):
              for name in names:
                  command = ["cargo", "test", "-p", "diskgraph-engine", "--lib", "--locked", "--offline", name,
                             "--", "--exact", "--nocapture", "--test-threads=1"]
                  try:
                      result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                              text=True, timeout=60)
                  except subprocess.TimeoutExpired as error:
                      output = error.stdout or ""
                      print(output.decode(errors="replace") if isinstance(output, bytes) else output, flush=True)
                      raise SystemExit(f"native metadata sentinel {name} timed out on attempt {attempt + 1}")
                  if result.returncode or "test result: ok. 1 passed; 0 failed;" not in result.stdout:
                      print(result.stdout, flush=True)
                      raise SystemExit(f"native metadata sentinel {name} failed on attempt {attempt + 1}")
                  print(f"native metadata sentinel {name} {attempt + 1}/20 passed", flush=True)
          PY
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Migration gate (ST-02)
        run: cargo test -p diskgraph-store --lib --locked -- --test-threads=1
      - name: Real-host drills stay out of the regular run (RE-02)
        run: |
          cargo test --workspace --locked -- --list
          cargo test -p diskgraph-ops --test specialist_real_host -- --list
      - name: FFI bindings generate (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build -p diskgraph-ffi --lib --locked
          mkdir -p "${{ runner.temp }}/diskgraph-bindings"
          cargo run -p diskgraph-ffi --bin uniffi-bindgen -- generate \
            target/debug/libdiskgraph_ffi.dylib --language swift --language kotlin \
            --no-format --out-dir "${{ runner.temp }}/diskgraph-bindings"

      - name: Paired native Linux scan namespace cost
        id: linux_scan_cost
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        timeout-minutes: 75
        run: python scripts/accept-linux-scan-namespace-cost.py --baseline-sha 2a2f8281f9f211b6632bdb26afdcd4a4fb21a44d --candidate-sha "${{ github.sha }}" --output-dir "${{ runner.temp }}/diskgraph-linux-scan-cost"
      - name: Preserve paired Linux scan cost evidence
        if: always() && matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.3.3
        with:
          name: linux-scan-namespace-cost-${{ github.run_id }}
          path: ${{ runner.temp }}/diskgraph-linux-scan-cost
          retention-days: 7
          if-no-files-found: warn

      - name: Diagnose original Linux baseline failure once
        if: failure() && steps.linux_scan_cost.conclusion == 'failure'
        timeout-minutes: 75
        run: |
          python -m unittest discover -s scripts -p test_diagnose_linux_baseline.py -v
          python scripts/diagnose-linux-baseline.py --output-dir "${{ runner.temp }}/diskgraph-linux-baseline-diagnostic"
      - name: Preserve separate Linux baseline diagnostic evidence
        if: always() && steps.linux_scan_cost.conclusion == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.3.3
        with:
          name: linux-baseline-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/diskgraph-linux-baseline-diagnostic
          retention-days: 7
          if-no-files-found: warn

  ffi-swift-host:
    name: Swift native host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: runner.os == 'macOS'
        with:
          python-version: '3.13'
      - name: Prepare actual fixed macOS installation for swift
        if: runner.os == 'macOS'
        id: macos_host_preparation
        run: |
          python -m unittest discover -s scripts/tests -p test_macos_host_preparation.py -v
          python scripts/qualify_macos_installed_worker.py --current-checkout --prepare-host-only --output-dir "$RUNNER_TEMP/macos-host-preparation"
      - name: Preserve macOS deployment preparation evidence
        if: always() && steps.macos_host_preparation.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-preparation-swift-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-host-preparation
          if-no-files-found: error
          retention-days: 7
      - name: Generate, compile and run real Swift host and system SQLite CRUD
        run: scripts/ffi-bindings-smoke.sh --swift-only
      - name: GRDB concurrent CRUD alongside Rust FFI, close and reopen
        run: scripts/ffi-grdb-smoke.sh

  ffi-kotlin-host:
    name: Kotlin native host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: runner.os == 'macOS'
        with:
          python-version: '3.13'
      - name: Prepare actual fixed macOS installation for kotlin
        if: runner.os == 'macOS'
        id: macos_host_preparation
        run: |
          python -m unittest discover -s scripts/tests -p test_macos_host_preparation.py -v
          python scripts/qualify_macos_installed_worker.py --current-checkout --prepare-host-only --output-dir "$RUNNER_TEMP/macos-host-preparation"
      - name: Preserve macOS deployment preparation evidence
        if: always() && steps.macos_host_preparation.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-preparation-kotlin-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-host-preparation
          if-no-files-found: error
          retention-days: 7
      - name: Bind Linux Kotlin host to actual release scan worker
        if: runner.os == 'Linux'
        id: kotlin_product_worker
        run: |
          cargo build --release --locked -p diskgraph-scan-worker --bin diskgraph-scan-worker --message-format=json > "$RUNNER_TEMP/product-worker-build.jsonl"
          python -m unittest discover -s scripts/tests -p test_linux_acceptance_worker.py -v
          python scripts/configure_linux_acceptance_worker.py --artifacts "$RUNNER_TEMP/product-worker-build.jsonl" --output-dir "$RUNNER_TEMP"
      - name: Preserve Linux Kotlin host worker identity
        if: always() && steps.kotlin_product_worker.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kotlin-product-worker-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/product-worker-build.jsonl
            ${{ runner.temp }}/product-worker-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Bind Windows Kotlin host to actual release scan worker
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked -p diskgraph-scan-worker --bin diskgraph-scan-worker --message-format=json > "$env:RUNNER_TEMP/windows-worker-build.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/configure_windows_acceptance_worker.ps1 -Artifacts "$env:RUNNER_TEMP/windows-worker-build.jsonl" -OutputDir "$env:RUNNER_TEMP"
      - name: Preserve Windows Kotlin worker identity
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kotlin-product-worker-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/windows-worker-build.jsonl
            ${{ runner.temp }}/product-worker-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Generate, compile and execute Kotlin with the native library
        run: python scripts/accept-ffi-kotlin.py

  # The vendored upstream scanner is its own workspace root, excluded from
  # this one so the format/lint gates never rewrite its pinned bytes; it
  # gets its own build and test here.
  vendored:
    name: Vendored scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
      # Pinned by tag: this action's current master commit exits 1 on
      # today's runners, while the release tag resolves and works.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build and test the vendored crate
        working-directory: crates/diskgraph-disktree-core
        run: cargo test --all-targets

  readonly-package:
    name: Native read-only package (${{ matrix.target }})
    needs: [vendored, fmt]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Worker package composition and file admission
        run: |
          python scripts/test_scan_worker_package.py -v
          python scripts/test_worker_manifest_admission.py -v
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: runner.os == 'macOS'
        with:
          python-version: '3.13'
      - name: Prepare actual fixed macOS installation for package
        if: runner.os == 'macOS'
        id: macos_host_preparation
        run: |
          python -m unittest discover -s scripts/tests -p test_macos_host_preparation.py -v
          python scripts/qualify_macos_installed_worker.py --current-checkout --prepare-host-only --output-dir "$RUNNER_TEMP/macos-host-preparation"
      - name: Preserve macOS deployment preparation evidence
        if: always() && steps.macos_host_preparation.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-preparation-package-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-host-preparation
          if-no-files-found: error
          retention-days: 7
      - name: Build current release binaries
        run: cargo build --release --locked -p diskgraph-cli -p diskgraph-mcp -p diskgraph-scan-worker --target ${{ matrix.target }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
        with:
          ref: e4d6074df496dd0816abca531362cdc68e082510
          path: previous
      - name: Build previous CLI for isolated upgrade and rollback
        working-directory: previous
        run: cargo build --release --locked -p diskgraph-cli --target ${{ matrix.target }}
      - name: Bind Linux package acceptance to actual release worker
        if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s scripts/tests -p test_package_worker_deployment.py -v
          cargo build --release --locked -p diskgraph-scan-worker --bin diskgraph-scan-worker --target ${{ matrix.target }} --message-format=json > "$RUNNER_TEMP/package-worker-artifacts.jsonl"
          python scripts/configure_linux_acceptance_worker.py --artifacts "$RUNNER_TEMP/package-worker-artifacts.jsonl" --output-dir "$RUNNER_TEMP"
      - name: Bind Windows package acceptance to actual release scan worker
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked -p diskgraph-scan-worker --bin diskgraph-scan-worker --target ${{ matrix.target }} --message-format=json > "$env:RUNNER_TEMP/windows-worker-build.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/configure_windows_acceptance_worker.ps1 -Artifacts "$env:RUNNER_TEMP/windows-worker-build.jsonl" -OutputDir "$env:RUNNER_TEMP"
      - name: Preserve package worker build identity
        if: always() && (runner.os == 'Linux' || runner.os == 'Windows')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.3.3
        with:
          name: package-worker-identity-${{ matrix.target }}
          path: ${{ runner.temp }}/product-worker-receipt.json
          retention-days: 7
      - name: Verify archive and packaged binaries
        run: python scripts/accept-readonly-package.py --target ${{ matrix.target }} --bin-dir target/${{ matrix.target }}/release --old-cli previous/target/${{ matrix.target }}/release/diskgraph${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.3.3
        with:
          name: readonly-candidate-${{ matrix.target }}
          path: dist/diskgraph-${{ matrix.target }}.*
          retention-days: 7

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
      # Pinned by tag: this action's current master commit exits 1 on
      # today's runners, while the release tag resolves and works.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting (workspace crates; the vendored copy is excluded by design)
        run: |
          cargo fmt \
            -p diskgraph-core -p diskgraph-store -p diskgraph-disktree \
            -p diskgraph-scan-worker \
            -p diskgraph-ffi -p diskgraph-testkit -p diskgraph-engine \
            -p diskgraph-cli -p diskgraph-mcp -p diskgraph-ops -- --check
