name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.97.0"]
        include:
          - os: macos-15-intel
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
      # Pinned by tag: this action's current master commit exits 1 on
      # today's runners, while the release tag resolves and works.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Read-only CLI, stdio and authenticated HTTP acceptance
        run: |
          python scripts/accept-readonly-stdio.py
          python scripts/accept-readonly-http.py
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Migration gate (ST-02)
        run: cargo test -p diskgraph-store --lib --locked
      - name: Real-host drills stay out of the regular run (RE-02)
        run: |
          cargo test --workspace --locked -- --list >/dev/null
          cargo test -p diskgraph-ops --test specialist_real_host -- --list >/dev/null
      - name: FFI bindings generate (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build -p diskgraph-ffi --lib --locked
          mkdir -p "${{ runner.temp }}/diskgraph-bindings"
          cargo run -p diskgraph-ffi --bin uniffi-bindgen -- generate \
            target/debug/libdiskgraph_ffi.dylib --language swift --language kotlin \
            --no-format --out-dir "${{ runner.temp }}/diskgraph-bindings"

  # The vendored upstream scanner is its own workspace root, excluded from
  # this one so the format/lint gates never rewrite its pinned bytes; it
  # gets its own build and test here.
  vendored:
    name: Vendored scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
      # Pinned by tag: this action's current master commit exits 1 on
      # today's runners, while the release tag resolves and works.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build and test the vendored crate
        working-directory: crates/diskgraph-disktree-core
        run: cargo test --all-targets

  readonly-package:
    name: Native read-only package (${{ matrix.target }})
    needs: [test, vendored, fmt]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build current release binaries
        run: cargo build --release --locked -p diskgraph-cli -p diskgraph-mcp --target ${{ matrix.target }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
        with:
          ref: e4d6074df496dd0816abca531362cdc68e082510
          path: previous
      - name: Build previous CLI for isolated upgrade and rollback
        working-directory: previous
        run: cargo build --release --locked -p diskgraph-cli --target ${{ matrix.target }}
      - name: Verify archive and packaged binaries
        run: python scripts/accept-readonly-package.py --target ${{ matrix.target }} --bin-dir target/${{ matrix.target }}/release --old-cli previous/target/${{ matrix.target }}/release/diskgraph${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.3.3
        with:
          name: readonly-candidate-${{ matrix.target }}
          path: dist/diskgraph-${{ matrix.target }}.*
          retention-days: 7

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
      # Pinned by tag: this action's current master commit exits 1 on
      # today's runners, while the release tag resolves and works.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting (workspace crates; the vendored copy is excluded by design)
        run: |
          cargo fmt \
            -p diskgraph-core -p diskgraph-store -p diskgraph-disktree \
            -p diskgraph-ffi -p diskgraph-testkit -p diskgraph-engine \
            -p diskgraph-cli -p diskgraph-mcp -p diskgraph-ops -- --check
