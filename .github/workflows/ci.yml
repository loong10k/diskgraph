name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - if: runner.os == 'macOS'
        run: |
          cargo build -p diskgraph-ffi --lib --locked
          mkdir -p "${{ runner.temp }}/diskgraph-bindings"
          cargo run -p diskgraph-ffi --bin uniffi-bindgen -- generate target/debug/libdiskgraph_ffi.dylib --language swift --language kotlin --no-format --out-dir "${{ runner.temp }}/diskgraph-bindings"
