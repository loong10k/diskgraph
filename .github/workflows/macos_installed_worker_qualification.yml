name: macOS installed scan worker qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Verify source mounting safeguards
        run: python -m unittest discover -s scripts/tests -p test_macos_installed_qualifier.py -v
      - name: Verify product response rejection safeguards
        run: python -m unittest discover -s scripts/tests -p test_macos_product_flows.py -v
      - name: Actual root issuer and ordinary UID helper qualification
        run: python scripts/qualify_macos_installed_worker.py --output-dir "${{ runner.temp }}/macos-installed-worker"
      - name: Preserve original source and native results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-installed-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/macos-installed-worker
            crates/diskgraph-engine/integration_candidates/macos_installed
